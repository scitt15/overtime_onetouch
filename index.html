<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="초근관리">
  <title>초과근무 통합 관리기 (아침/저녁)</title>
  <style>
    :root {
      --gov-navy: #1b3a6b;
      --gov-dark: #0f2347;
      --gov-blue: #2563eb;
      --gov-light-blue: #f0f5fc;
      --gov-border: #d5e0ee;
      --gov-slate: #475569;
      --gov-gray-bg: #f4f6f9;
      --gov-card-bg: #ffffff;
      --gov-accent-red: #dc2626;
      --gov-morning: #ea580c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--gov-gray-bg); color: #1e293b; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
    
    .header-bar {
      background: linear-gradient(135deg, var(--gov-navy), var(--gov-dark));
      color: #ffffff; padding: 16px 18px; border-radius: 14px; border-left: 5px solid #60a5fa;
    }
    .header-title { font-size: 18px; font-weight: 700; }
    .header-subtitle { font-size: 11px; color: #bfdbfe; margin-top: 4px; line-height: 1.4; }

    .card { background: var(--gov-card-bg); border-radius: 12px; padding: 14px 16px; border: 1px solid var(--gov-border); }
    .month-filter { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--gov-border); }
    .month-filter input { border: 1px solid var(--gov-border); background: var(--gov-light-blue); color: var(--gov-navy); font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }

    .summary-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
    .summary-box { background-color: var(--gov-light-blue); border: 1px solid #d0e1f9; border-radius: 8px; padding: 12px; }
    .summary-label { font-size: 11px; color: var(--gov-slate); font-weight: 600; margin-bottom: 2px; }
    .summary-value { font-size: 22px; font-weight: 800; color: var(--gov-navy); }

    /* 액션 버튼 섹션 */
    .action-container { display: flex; flex-direction: column; gap: 8px; }
    .btn-action {
      border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 800; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-evening { background-color: var(--gov-blue); }
    .btn-morning { background-color: var(--gov-morning); }
    .btn-sub { font-size: 11px; font-weight: normal; opacity: 0.9; }

    /* 프리셋 및 수동 */
    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-preset {
      background-color: #f1f5f9; border: 1px solid #cbd5e1; color: var(--gov-navy); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
    }
    .manual-toggle { width: 100%; text-align: center; font-size: 12px; font-weight: 600; color: var(--gov-slate); background: none; border: 1px dashed #cbd5e1; padding: 8px; border-radius: 6px; cursor: pointer; }
    .manual-form { display: none; background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; gap: 8px; flex-direction: column; margin-top: 6px; }
    .manual-form.show { display: flex; }
    .input-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 6px; }
    .input-row input { border: 1px solid #cbd5e1; padding: 6px; border-radius: 4px; font-size: 12px; }
    .btn-save-manual { background: var(--gov-navy); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; }

    /* 리스트 */
    .history-header { font-size: 13px; font-weight: 700; color: var(--gov-navy); border-left: 3px solid var(--gov-navy); padding-left: 8px; margin-bottom: 8px; }
    .log-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .log-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
    .log-tag { font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 700; margin-right: 4px; }
    .tag-eve { background-color: #dbeafe; color: #1d4ed8; }
    .tag-mor { background-color: #ffedd5; color: #c2410c; }
    .log-date { font-size: 12px; font-weight: 700; color: #0f172a; }
    .log-times { font-size: 11px; color: #64748b; margin-top: 2px; }
    .log-recognized { font-size: 14px; font-weight: 800; color: var(--gov-blue); text-align: right; }
    .btn-del { background: none; border: none; color: #cbd5e1; font-size: 15px; cursor: pointer; padding-left: 8px; }
    .btn-del:hover { color: var(--gov-accent-red); }

    .footer-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tool-btn { background: #fff; border: 1px solid var(--gov-border); padding: 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #334155; cursor: pointer; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header-bar">
      <div class="header-title">🏢 공무원 초과근무 관리기</div>
      <div class="header-subtitle">
        • 평일 하루 총 실근무시간에서 1시간 의무 공제<br>
        • 아침(조기출근) + 저녁 근무 시 1일 합산 공제 지원
      </div>
    </header>

    <section class="card">
      <div class="month-filter">
        <label for="selectedMonth" style="font-size:12px; font-weight:600; color:var(--gov-slate);">조회 월</label>
        <input type="month" id="selectedMonth">
      </div>
      <div class="summary-grid">
        <div class="summary-box">
          <div class="summary-label">당월 총 인정시간</div>
          <div class="summary-value" id="monthlyTotalTime">0시간 00분</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">초근 일수</div>
          <div class="summary-value" id="workDayCount">0일</div>
        </div>
      </div>
    </section>

    <!-- 액션 영역 -->
    <section class="card action-container">
      <!-- 저녁 퇴근 버튼 -->
      <button class="btn-action btn-evening" onclick="handleEveningNow()">
        🌙 오늘 저녁 초근 등록 (현재 시각)
        <span class="btn-sub">17:00 ~ 현재 시각 (최대 21:40)</span>
      </button>

      <!-- 아침 출근 버튼 -->
      <button class="btn-action btn-morning" onclick="handleMorningNow()">
        ☀️ 오늘 아침 초근 등록 (현재 출근)
        <span class="btn-sub">현재 시각 ~ 09:00 출근 기록</span>
      </button>

      <!-- 퀵 프리셋 -->
      <div class="preset-grid">
        <button class="btn-preset" onclick="addQuick('morning', '07:30', '08:30')">아침 07:30~08:30</button>
        <button class="btn-preset" onclick="addQuick('evening', '17:00', '21:40')">저녁 21:40 만근</button>
      </div>

      <!-- 수동 직접 입력 -->
      <button class="manual-toggle" onclick="toggleManual()">📅 날짜/시간 직접 입력 ▼</button>
      <div class="manual-form" id="manualForm">
        <div class="input-row">
          <input type="date" id="mDate">
          <input type="time" id="mStart" value="17:00">
          <input type="time" id="mEnd" value="20:00">
        </div>
        <button class="btn-save-manual" onclick="handleManualSave()">저장</button>
      </div>
    </section>

    <!-- 목록 리스트 -->
    <section class="card">
      <div class="history-header">월별 복무 내역</div>
      <div id="logList" class="log-list"></div>
    </section>

    <!-- 하단 툴바 -->
    <div class="footer-tools">
      <button class="tool-btn" onclick="downloadCSV()">📑 엑셀(CSV) 저장</button>
      <button class="tool-btn" onclick="backupJSON()">💾 데이터 백업</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "gov_overtime_hybrid_v1";

    document.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      document.getElementById("selectedMonth").value = now.toISOString().slice(0, 7);
      document.getElementById("mDate").value = now.toISOString().slice(0, 10);
      document.getElementById("selectedMonth").addEventListener("change", render);
      render();
    });

    function getLogs() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    function saveLogs(logs) { localStorage.setItem(STORAGE_KEY, JSON.stringify(logs)); render(); }

    // 저녁 원클릭 (17:00 ~ 현재)
    function handleEveningNow() {
      const now = new Date();
      let hh = now.getHours();
      let mm = now.getMinutes();

      if (hh < 17) return alert("아직 17:00 이전입니다.");
      if (hh > 21 || (hh === 21 && mm > 40)) {
        hh = 21; mm = 40;
        alert("21:40 상한으로 자동 보정됩니다.");
      }

      const endStr = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
      recordSegment(now.toISOString().slice(0, 10), "17:00", endStr, "저녁");
    }

    // 아침 원클릭 (현재 출근 시각 ~ 09:00)
    function handleMorningNow() {
      const now = new Date();
      let hh = now.getHours();
      let mm = now.getMinutes();

      if (hh >= 9) return alert("09:00 이후에는 아침 초근을 등록할 수 없습니다.");
      
      const startStr = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
      recordSegment(now.toISOString().slice(0, 10), startStr, "09:00", "아침");
    }

    function addQuick(type, s, e) {
      const now = new Date();
      const date = document.getElementById("mDate").value || now.toISOString().slice(0, 10);
      recordSegment(date, s, e, type === 'morning' ? '아침' : '저녁');
    }

    function toggleManual() { document.getElementById("manualForm").classList.toggle("show"); }
    function handleManualSave() {
      const d = document.getElementById("mDate").value;
      const s = document.getElementById("mStart").value;
      const e = document.getElementById("mEnd").value;
      if (!d || !s || !e) return alert("모두 입력해주세요.");
      recordSegment(d, s, e, "직접입력");
      document.getElementById("manualForm").classList.remove("show");
    }

    // 시간 등록 및 당일 통합 1시간 공제 계산
    function recordSegment(date, start, end, label) {
      const [sh, sm] = start.split(":").map(Number);
      const [eh, em] = end.split(":").map(Number);
      const sMin = sh * 60 + sm;
      const eMin = eh * 60 + em;

      if (eMin <= sMin) return alert("종료 시각이 시작 시각보다 빠릅니다.");

      const diffMin = eMin - sMin;
      const logs = getLogs();

      logs.unshift({
        id: Date.now(),
        date,
        start,
        end,
        workedMin: diffMin,
        label
      });

      logs.sort((a, b) => b.date.localeCompare(a.date));
      saveLogs(logs);
      alert(`[${date}] ${label} 초근 (${start} ~ ${end}) 등록 완료!`);
    }

    function deleteRecord(id) {
      if (confirm("해당 기록을 삭제할까요?")) {
        saveLogs(getLogs().filter(l => l.id !== id));
      }
    }

    // 당일 합산 1시간 공제 핵심 계산 로직
    function calculateDailyTotals(monthLogs) {
      // 날짜별로 그룹화
      const dayMap = {};
      monthLogs.forEach(l => {
        if (!dayMap[l.date]) dayMap[l.date] = { totalWorked: 0, items: [] };
        dayMap[l.date].totalWorked += l.workedMin;
        dayMap[l.date].items.push(l);
      });

      let grandTotalRecognized = 0;
      const processedDays = [];

      Object.keys(dayMap).sort().reverse().forEach(date => {
        const day = dayMap[date];
        // 하루 총 실근무시간에서 1시간(60분) 단 1회 공제
        const dayRecognized = Math.max(0, day.totalWorked - 60);
        grandTotalRecognized += dayRecognized;

        processedDays.push({
          date,
          totalWorked: day.totalWorked,
          recognized: dayRecognized,
          items: day.items
        });
      });

      return { grandTotalRecognized, processedDays, uniqueDays: Object.keys(dayMap).length };
    }

    function render() {
      const targetMonth = document.getElementById("selectedMonth").value;
      const logs = getLogs().filter(l => l.date.startsWith(targetMonth));
      const calc = calculateDailyTotals(logs);

      const h = Math.floor(calc.grandTotalRecognized / 60);
      const m = calc.grandTotalRecognized % 60;
      document.getElementById("monthlyTotalTime").textContent = `${h}시간 ${String(m).padStart(2,'0')}분`;
      document.getElementById("workDayCount").textContent = `${calc.uniqueDays}일`;

      const listEl = document.getElementById("logList");
      listEl.innerHTML = "";

      if (calc.processedDays.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; padding:15px; color:#94a3b8; font-size:12px;">기록이 없습니다.</div>';
        return;
      }

      calc.processedDays.forEach(day => {
        const rh = Math.floor(day.recognized / 60);
        const rm = day.recognized % 60;

        let detailsHtml = day.items.map(item => `
          <div style="font-size:11px; color:#64748b; margin-top:2px;">
            <span class="log-tag ${item.label === '아침' ? 'tag-mor' : 'tag-eve'}">${item.label}</span>
            ${item.start} ~ ${item.end} (${Math.floor(item.workedMin/60)}h ${item.workedMin%60}m)
            <button class="btn-del" onclick="deleteRecord(${item.id})">✕</button>
          </div>
        `).join("");

        const div = document.createElement("div");
        div.className = "log-item";
        div.innerHTML = `
          <div>
            <div class="log-date">${day.date}</div>
            ${detailsHtml}
          </div>
          <div style="text-align: right;">
            <div class="log-recognized">${rh}시간 ${rm}분</div>
            <div style="font-size:9px; color:#94a3b8;">당일 합산 -1h 공제</div>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function downloadCSV() {
      const logs = getLogs();
      if (logs.length === 0) return alert("데이터가 없습니다.");
      let csv = "\uFEFF날짜,구분,시작,종료,실근무(분)\n";
      logs.forEach(l => { csv += `${l.date},${l.label},${l.start},${l.end},${l.workedMin}\n`; });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `초과근무_${document.getElementById("selectedMonth").value}.csv`;
      a.click();
    }

    function backupJSON() {
      const blob = new Blob([JSON.stringify(getLogs(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `초근백업_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }
  </script>
</body>
</html>

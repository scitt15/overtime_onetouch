<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="초근관리">
  <title>초과근무 원터치 관리기</title>
  <style>
    :root {
      --gov-navy: #1b3a6b;
      --gov-dark: #0f2347;
      --gov-blue: #2563eb;
      --gov-light-blue: #f0f5fc;
      --gov-border: #d5e0ee;
      --gov-slate: #475569;
      --gov-gray-bg: #f4f6f9;
      --gov-card-bg: #ffffff;
      --gov-accent-red: #dc2626;
      --gov-accent-green: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--gov-gray-bg);
      color: #1e293b;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 헤더 */
    .header-bar {
      background: linear-gradient(135deg, var(--gov-navy), var(--gov-dark));
      color: #ffffff;
      padding: 18px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(15, 35, 71, 0.15);
      border-left: 5px solid #60a5fa;
    }
    .header-title {
      font-size: 19px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-subtitle {
      font-size: 12px;
      color: #bfdbfe;
      margin-top: 6px;
      line-height: 1.4;
    }

    /* 카드 공통 */
    .card {
      background: var(--gov-card-bg);
      border-radius: 14px;
      padding: 16px 18px;
      border: 1px solid var(--gov-border);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    /* 대시보드 */
    .month-filter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--gov-border);
    }
    .month-filter label { font-size: 13px; font-weight: 600; color: var(--gov-slate); }
    .month-filter input {
      border: 1px solid var(--gov-border);
      background-color: var(--gov-light-blue);
      color: var(--gov-navy);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
    }
    .summary-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
    .summary-box { background-color: var(--gov-light-blue); border: 1px solid #d0e1f9; border-radius: 10px; padding: 12px 14px; }
    .summary-label { font-size: 11px; color: var(--gov-slate); font-weight: 600; margin-bottom: 4px; }
    .summary-value { font-size: 24px; font-weight: 800; color: var(--gov-navy); letter-spacing: -0.5px; }

    /* 메인 액션 버튼 */
    .btn-main {
      background-color: var(--gov-blue);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 20px;
      font-size: 18px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .btn-main:active { transform: scale(0.98); }
    .btn-main-sub { font-size: 12px; font-weight: 500; opacity: 0.9; }

    /* 퀵 프리셋 버튼 */
    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .btn-preset {
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: var(--gov-navy);
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .btn-preset span { font-size: 10px; color: var(--gov-slate); font-weight: normal; }
    .btn-preset:active { background-color: #e2e8f0; }

    /* 수동 입력 폼 */
    .manual-toggle {
      width: 100%; text-align: center; font-size: 12px; font-weight: 600; color: var(--gov-slate);
      background: none; border: 1px dashed #cbd5e1; padding: 10px; border-radius: 8px; margin-top: 10px; cursor: pointer;
    }
    .manual-form {
      display: none; background: #f8fafc; border: 1px solid #e2e8f0; padding: 14px; border-radius: 10px; margin-top: 8px; gap: 10px; flex-direction: column;
    }
    .manual-form.show { display: flex; }
    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-group label { font-size: 11px; font-weight: 600; color: var(--gov-slate); }
    .input-group input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .btn-save-manual { background: var(--gov-navy); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    /* 리스트 */
    .history-header { font-size: 13px; font-weight: 700; color: var(--gov-navy); border-left: 3px solid var(--gov-navy); padding-left: 8px; margin-bottom: 10px; }
    .log-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .log-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .log-date { font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
    .log-times { font-size: 11px; color: #64748b; }
    .log-recognized { font-size: 15px; font-weight: 800; color: var(--gov-blue); text-align: right; }
    .log-deduction { font-size: 10px; color: #94a3b8; text-align: right; }
    .btn-del { background: none; border: none; color: #cbd5e1; font-size: 16px; cursor: pointer; padding-left: 10px; }
    .btn-del:hover { color: var(--gov-accent-red); }
    .empty-state { text-align: center; padding: 20px; color: #94a3b8; font-size: 12px; }

    /* 하단 툴바 */
    .footer-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .tool-btn { background: #fff; border: 1px solid var(--gov-border); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; color: #334155; cursor: pointer; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    
    <header class="header-bar">
      <div class="header-title">🏢 초과근무 원터치 관리기</div>
      <div class="header-subtitle">
        • 기본 시작 시각: 17:00 자동 적용<br>
        • 상한 시간: 21:40 자동 보정<br>
        • 평일 1시간 의무 공제 자동 계산
      </div>
    </header>

    <section class="card">
      <div class="month-filter">
        <label for="selectedMonth">조회 월 선택</label>
        <input type="month" id="selectedMonth">
      </div>
      <div class="summary-grid">
        <div class="summary-box">
          <div class="summary-label">당월 인정 총시간</div>
          <div class="summary-value" id="monthlyTotalTime">0h 00m</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">초근 일수</div>
          <div class="summary-value" id="workDayCount">0일</div>
        </div>
      </div>
    </section>

    <section class="card">
      <!-- 메인: 현재 시각으로 퇴근 기록 -->
      <button class="btn-main" onclick="handleCurrentTimeRecord()">
        👉 오늘 초과근무 지금 등록
        <span class="btn-main-sub" id="currentTimePreview">17:00 ~ 현재 시각으로 즉시 기록</span>
      </button>

      <!-- 퀵 프리셋 -->
      <div class="preset-grid">
        <button class="btn-preset" onclick="handlePresetRecord('21:40')">
          21:40 만근 기록
          <span>(3시간 40분 인정)</span>
        </button>
        <button class="btn-preset" onclick="handlePresetRecord('20:00')">
          20:00 퇴근 기록
          <span>(2시간 00분 인정)</span>
        </button>
      </div>

      <!-- 수동 입력 -->
      <button class="manual-toggle" onclick="toggleManualForm()">📅 다른 날짜 / 시간 직접 입력 ▼</button>
      <div class="manual-form" id="manualForm">
        <div class="input-group">
          <label>근무 일자</label>
          <input type="date" id="mDate">
        </div>
        <div class="input-group">
          <label>종료 시각 (시작은 17:00 고정)</label>
          <input type="time" id="mEnd" value="19:00">
        </div>
        <button class="btn-save-manual" onclick="handleManualSave()">해당 시각으로 저장</button>
      </div>
    </section>

    <section class="card">
      <div class="history-header">월별 복무 기록 내역</div>
      <div id="logList" class="log-list"></div>
    </section>

    <div class="footer-tools">
      <button class="tool-btn" onclick="downloadCSV()">📑 엑셀(CSV) 다운로드</button>
      <button class="tool-btn" onclick="backupJSON()">💾 데이터 백업</button>
      <input type="file" id="restoreFileInput" style="display: none;" accept=".json" onchange="restoreJSON(event)">
      <button class="tool-btn" style="grid-column: span 2;" onclick="document.getElementById('restoreFileInput').click()">📂 백업 파일 불러오기</button>
    </div>

  </div>

  <script>
    const STORAGE_KEY = "gov_overtime_onetouch_v1";
    const START_HH = 17;
    const START_MM = 0;
    const MAX_HH = 21;
    const MAX_MM = 40;

    document.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      document.getElementById("selectedMonth").value = now.toISOString().slice(0, 7);
      document.getElementById("mDate").value = now.toISOString().slice(0, 10);
      document.getElementById("selectedMonth").addEventListener("change", render);
      
      // 실시간 버튼 텍스트 업데이트
      setInterval(updatePreviewText, 1000);
      updatePreviewText();
      
      render();
    });

    function updatePreviewText() {
      const now = new Date();
      let hh = now.getHours();
      let mm = now.getMinutes();
      
      if (hh < START_HH) {
        document.getElementById("currentTimePreview").textContent = "현재 17:00 이전 (기록 불가)";
      } else {
        if (hh > MAX_HH || (hh === MAX_HH && mm > MAX_MM)) {
          hh = MAX_HH; mm = MAX_MM;
        }
        document.getElementById("currentTimePreview").textContent = `17:00 ~ ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} 기록 (1h 공제)`;
      }
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    }

    function saveLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
      render();
    }

    // 메인 버튼 (현재 시각 기반)
    function handleCurrentTimeRecord() {
      const now = new Date();
      let hh = now.getHours();
      let mm = now.getMinutes();

      if (hh < START_HH) {
        alert("아직 17:00 이전입니다. 퇴근(17:00) 이후에 기록해주세요.");
        return;
      }

      // 21:40 초과 시 자동 컷
      if (hh > MAX_HH || (hh === MAX_HH && mm > MAX_MM)) {
        hh = MAX_HH;
        mm = MAX_MM;
        alert(`21:40을 초과하여 최대 상한 시간인 21:40으로 보정하여 기록합니다.`);
      }

      const endStr = String(hh).padStart(2, '0') + ":" + String(mm).padStart(2, '0');
      const dateStr = now.toISOString().slice(0, 10);
      
      processRecord(dateStr, endStr);
    }

    // 프리셋 버튼
    function handlePresetRecord(endStr) {
      const now = new Date();
      const dateStr = document.getElementById("mDate").value || now.toISOString().slice(0, 10);
      processRecord(dateStr, endStr);
    }

    function toggleManualForm() {
      document.getElementById("manualForm").classList.toggle("show");
    }

    function handleManualSave() {
      const dateStr = document.getElementById("mDate").value;
      let endStr = document.getElementById("mEnd").value;
      
      if (!dateStr || !endStr) return alert("날짜와 종료 시각을 입력하세요.");
      
      const [eh, em] = endStr.split(':').map(Number);
      if (eh < START_HH) {
        alert("종료 시각은 17:00 이후여야 합니다.");
        return;
      }
      if (eh > MAX_HH || (eh === MAX_HH && em > MAX_MM)) {
        endStr = "21:40";
        alert("21:40을 초과하여 최대 상한 시간인 21:40으로 기록됩니다.");
      }

      processRecord(dateStr, endStr);
      document.getElementById("manualForm").classList.remove("show");
    }

    // 핵심 로직: 계산 및 저장
    function processRecord(date, endStr) {
      const startMin = START_HH * 60 + START_MM; // 1020
      const [eh, em] = endStr.split(':').map(Number);
      const endMin = eh * 60 + em;

      if (endMin <= startMin) {
        alert("종료 시각이 17:00 이전이거나 같습니다.");
        return;
      }

      const totalWorkedMin = endMin - startMin;
      const recognizedMin = Math.max(0, totalWorkedMin - 60); // 1시간 공제

      let logs = getLogs();
      const existingIdx = logs.findIndex(l => l.date === date);
      if (existingIdx > -1) {
        if (!confirm(`해당 날짜(${date})의 기록이 이미 존재합니다. 덮어쓰시겠습니까?`)) return;
        logs.splice(existingIdx, 1);
      }

      logs.unshift({
        id: Date.now(),
        date,
        start: "17:00",
        end: endStr,
        totalMin: totalWorkedMin,
        recognizedMin: recognizedMin
      });

      // 날짜 내림차순 정렬
      logs.sort((a, b) => b.date.localeCompare(a.date));
      saveLogs(logs);

      const rH = Math.floor(recognizedMin / 60);
      const rM = recognizedMin % 60;
      alert(`[${date}] 초과근무 등록 완료!\n- 실근무: 17:00 ~ ${endStr}\n- 1시간 공제 후 최종 인정: ${rH}시간 ${rM}분`);
    }

    function deleteRecord(id) {
      if (confirm("해당 기록을 삭제하시겠습니까?")) {
        saveLogs(getLogs().filter(l => l.id !== id));
      }
    }

    // 화면 렌더링
    function render() {
      const targetMonth = document.getElementById("selectedMonth").value;
      const logs = getLogs().filter(l => l.date.startsWith(targetMonth));

      let totalMin = 0;
      logs.forEach(l => totalMin += l.recognizedMin);

      document.getElementById("monthlyTotalTime").textContent = `${Math.floor(totalMin/60)}시간 ${totalMin%60}분`;
      document.getElementById("workDayCount").textContent = `${logs.length}일`;

      const listEl = document.getElementById("logList");
      listEl.innerHTML = "";

      if (logs.length === 0) {
        listEl.innerHTML = `<div class="empty-state">해당 월의 기록이 없습니다.</div>`;
        return;
      }

      logs.forEach(l => {
        const rh = Math.floor(l.recognizedMin / 60);
        const rm = l.recognizedMin % 60;
        
        listEl.innerHTML += `
          <div class="log-item">
            <div>
              <div class="log-date">${l.date}</div>
              <div class="log-times">17:00 ~ ${l.end} (실근무 ${Math.floor(l.totalMin/60)}h ${l.totalMin%60}m)</div>
            </div>
            <div style="display: flex; align-items: center;">
              <div>
                <div class="log-recognized">${rh}시간 ${String(rm).padStart(2,'0')}분</div>
                <div class="log-deduction">-1h 공제됨</div>
              </div>
              <button class="btn-del" onclick="deleteRecord(${l.id})">✕</button>
            </div>
          </div>
        `;
      });
    }

    // 엑셀 다운로드
    function downloadCSV() {
      const logs = getLogs();
      if (logs.length === 0) return alert("데이터가 없습니다.");
      
      let csv = "\uFEFF근무일자,시작시각,종료시각,총근무(분),최종인정(분),인정시간\n";
      logs.forEach(l => {
        const h = Math.floor(l.recognizedMin / 60);
        const m = l.recognizedMin % 60;
        csv += `${l.date},${l.start},${l.end},${l.totalMin},${l.recognizedMin},"${h}시간 ${m}분"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `초과근무_내역_${document.getElementById("selectedMonth").value}.csv`;
      a.click();
    }

    // JSON 백업 / 복원
    function backupJSON() {
      const blob = new Blob([JSON.stringify(getLogs(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `초근_백업_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function restoreJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported) && confirm("기존 데이터와 병합하여 복원하시겠습니까?")) {
            const current = getLogs();
            const merged = [...imported, ...current];
            const unique = Array.from(new Map(merged.map(item => [item.date, item])).values());
            unique.sort((a, b) => b.date.localeCompare(a.date));
            saveLogs(unique);
            alert("복원이 완료되었습니다.");
          }
        } catch (err) { alert("잘못된 파일입니다."); }
      };
      reader.readAsText(file);
      event.target.value = "";
    }
  </script>
</body>
</html>
